<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GHOUL 99 - ORIGINAL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#020204;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100svh;padding:max(6px,env(safe-area-inset-top)) 6px max(8px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 8%,#4b111c 0,#10070b 38%,#020204 82%);display:flex;align-items:stretch}
.machine{width:100%;border:2px solid #6d1723;border-radius:24px;padding:7px;background:linear-gradient(#191a20,#060609);box-shadow:0 0 45px #000,inset 0 0 35px #000;display:flex;flex-direction:column}
.header{height:50px;border-radius:14px;background:linear-gradient(90deg,#07070a,#681521,#07070a);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:1000;letter-spacing:7px;text-shadow:0 0 10px #f33,0 0 25px #f11}
.lamps{display:flex;justify-content:space-around;padding:7px 10px}.lamp{width:9px;height:9px;border-radius:50%;background:#26080d}.lamp.on{background:#ff364b;box-shadow:0 0 15px #ff364b}
.info{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}.box{background:#17181e;border:1px solid #3a252a;border-radius:8px;text-align:center;padding:4px;color:#999;font-size:9px}.v{display:block;color:#ff6271;font-size:15px;font-weight:1000}
.screen{height:min(57svh,510px);min-height:390px;position:relative;overflow:hidden;border:4px solid #2a2b31;border-radius:17px;background:radial-gradient(circle at 50% 43%,#56131f 0,#1a090e 25%,#050508 72%);box-shadow:inset 0 0 70px #000}
.screen.flash{animation:screenFlash .18s steps(2) 2}
@keyframes screenFlash{50%{filter:brightness(2.4)}}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px);z-index:20}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:5}
.mode{font-size:11px;letter-spacing:2px;color:#aaa}.title{font-size:clamp(36px,11vw,55px);font-weight:1000;letter-spacing:8px;text-shadow:0 0 10px #f33,0 0 28px #8c1724;margin:8px 0;transition:.2s}
.title.glow{animation:titlePulse .55s infinite alternate}
@keyframes titlePulse{to{transform:scale(1.08);text-shadow:0 0 14px #fff,0 0 35px #f22,0 0 60px #f00}}
.msg{height:27px;color:#ff9ba5;font-weight:900;text-align:center}
.reels{display:flex;gap:7px;margin:12px 0}.reel{width:clamp(68px,22vw,86px);height:clamp(78px,24vw,98px);border:2px solid #743943;border-radius:11px;background:linear-gradient(#34353e,#101117);display:grid;place-items:center;font-size:clamp(40px,13vw,55px);font-weight:1000;box-shadow:inset 0 0 20px #000;transition:.15s}.reel.hot{border-color:#ff394d;box-shadow:0 0 25px #e22,inset 0 0 20px #000;transform:scale(1.05)}
.cutin{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}.cutin b{font-size:clamp(38px,12vw,62px);color:#fff;text-shadow:0 0 10px #f00,0 0 35px #f00;transform:skew(-8deg);animation:cut .35s ease-out}
@keyframes cut{from{transform:scale(2) skew(-8deg);opacity:0}to{transform:scale(1) skew(-8deg);opacity:1}}
.dropbar{position:absolute;z-index:35;left:4%;right:4%;top:-45px;height:43px;background:linear-gradient(#fff,#ddd);display:none;box-shadow:0 0 35px 10px #fff;border-radius:0 0 8px 8px}
.dropText{position:absolute;z-index:36;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(30px,10vw,52px);font-weight:1000;color:#fff;text-shadow:0 0 12px #f00,0 0 35px #f00;pointer-events:none}
.preAlert{position:absolute;z-index:34;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,30,50,.35),transparent 65%);pointer-events:none}
.preAlert span{font-size:clamp(28px,9vw,48px);font-weight:1000;letter-spacing:4px;color:#fff;text-shadow:0 0 8px #f00,0 0 28px #f00;animation:alertPulse .22s infinite alternate}
@keyframes alertPulse{to{transform:scale(1.12);filter:brightness(1.5)}}
.countdown{position:absolute;z-index:33;display:none;font-size:90px;font-weight:1000;color:#fff;text-shadow:0 0 20px #f00}
.controls{margin-top:7px;display:grid;grid-template-columns:1.2fr 1fr;gap:6px}.controls button{min-height:50px;border:0;border-radius:10px;color:#fff;font-size:13px;font-weight:1000;background:linear-gradient(#424550,#20222a);box-shadow:inset 0 1px #777}.controls .main{background:linear-gradient(#c93446,#6e121e);box-shadow:0 0 16px #511019}.controls button:active{transform:scale(.98)}.controls button:disabled{opacity:.32}
.options{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;padding:8px 2px 3px}.opt{background:#111217;border:1px solid #29292f;border-radius:8px;padding:6px}.opt label{display:flex;justify-content:space-between;align-items:center}.opt input{accent-color:#d92d42}
.history{margin-top:6px;max-height:88px;overflow:auto;font-size:11px;background:#0d0d11;border-radius:8px;padding:2px 6px}.history div{padding:4px;border-bottom:1px solid #25252b}
.note{margin-top:6px;padding:5px;color:#777;font-size:9px;line-height:1.4;text-align:center}
.small{font-size:9px;color:#aaa}
</style>
</head>
<body>
<div id="app"><div class="machine">
<div class="header">GHOUL 99</div>
<div id="lamps" class="lamps"></div>
<div class="info">
<div class="box">MODE<span id="mode" class="v">通常</span></div>
<div class="box">玉<span id="balls" class="v">250</span></div>
<div class="box">回転<span id="spins" class="v">0</span></div>
<div class="box">RUSH<span id="rush" class="v">--</span></div>
<div class="box">連チャン<span id="streak" class="v">0</span></div>
</div>

<div id="screen" class="screen">
  <div class="stage">
    <div id="modeText" class="mode">NORMAL 1/99</div>
    <div id="title" class="title">GHOUL</div>
    <div id="msg" class="msg">STARTで変動</div>
    <div class="reels"><div id="r1" class="reel">1</div><div id="r2" class="reel">2</div><div id="r3" class="reel">3</div></div>
  </div>
  <div id="preAlert" class="preAlert"><span>先バレ!!</span></div>
  <div id="cutin" class="cutin"><b id="cutinText">BONUS</b></div>
  <div id="dropbar" class="dropbar"></div>
  <div id="dropText" class="dropText">手落ち!!</div>
  <div id="countdown" class="countdown"></div>
</div>

<div class="controls">
  <button id="spin" class="main">START / 変動</button>
  <button id="rushBtn" disabled>RUSH消化</button>
  <button id="auto">AUTO OFF</button>
  <button id="reset">リセット</button>
</div>

<div class="options">
  <div class="opt"><label>手落ちカスタム <input id="drop" type="checkbox"></label><div class="small">当たり時の手落ち演出</div></div>
  <div class="opt"><label>先バレモード <input id="pre" type="checkbox"></label><div class="small">当たり時40%で先バレ</div></div>
  <div class="opt"><label>効果音 <input id="sound" type="checkbox" checked></label><div class="small">演出SE</div></div>
  <div class="opt"><label>オリジナルBGM <input id="bgm" type="checkbox"></label><div class="small">Safariはタップ後に再生</div></div>
</div>

<div class="history" id="history">まだありません</div>
<div class="note">公式実機の画像・ロゴ・演出・音源は使用しないオリジナルゲームです。ゲーム内の確率・演出は本作独自仕様です。</div>
</div></div>

<script>
(()=> {
const $=id=>document.getElementById(id);
let balls=250,spins=0,mode="normal",rush=0,busy=false,auto=false,streak=0,audio=null,bgmTimer=null;
const NORMAL_RATE=1/99, RUSH_RATE=.18, PRE_RATE=.40;

for(let i=0;i<12;i++){const x=document.createElement("i");x.className="lamp";$("lamps").appendChild(x)}
const wait=n=>new Promise(r=>setTimeout(r,n));

function audioReady(){
 try{
   if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
   if(audio.state==="suspended")audio.resume();
   return true;
 }catch(e){return false}
}
function beep(f=440,d=.08,t="sine",v=.035){
 if(!$("sound").checked||!audioReady())return;
 try{
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d);
 }catch(e){}
}
function startBgm(){
 if(!$("bgm").checked||bgmTimer)return;
 audioReady();
 const seq=[110,138,164,138,98,123,146,123];let i=0;
 bgmTimer=setInterval(()=>{if($("bgm").checked)beep(seq[i++%seq.length],.20,"triangle",.012)},360);
}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
function update(){
 $("balls").textContent=balls;
 $("spins").textContent=spins;
 $("mode").textContent=mode==="rush"?"RUSH":"通常";
 $("rush").textContent=mode==="rush"?rush:"--";
 $("streak").textContent=streak;
 $("modeText").textContent=mode==="rush"?"RUSH MODE 1/5.6":"NORMAL 1/99";
 $("spin").disabled=busy||mode==="rush";
 $("rushBtn").disabled=busy||mode!=="rush";
 $("auto").textContent="AUTO "+(auto?"ON":"OFF");
}
function addHistory(t){
 const h=$("history");
 if(h.textContent==="まだありません")h.textContent="";
 const time=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
 h.innerHTML="<div>"+time+"　"+t+"</div>"+h.innerHTML;
}
function lamps(on){
 document.querySelectorAll(".lamp").forEach((x,i)=>x.classList.toggle("on",on&&i%2===0));
}
async function preAlert(){
 const p=$("preAlert");p.style.display="flex";lamps(true);
 beep(210,.10,"square",.07);await wait(90);beep(320,.12,"square",.07);await wait(220);
 p.style.display="none";lamps(false);
}
async function handDrop(){
 if(!$("drop").checked)return;
 const b=$("dropbar"),t=$("dropText"),s=$("screen");
 b.style.display="block";t.style.display="flex";s.classList.add("flash");
 beep(75,.16,"sawtooth",.08);
 b.animate([{top:"-45px"},{top:"105%"}],{duration:340,easing:"ease-in"});
 await wait(360);
 b.style.display="none";t.style.display="none";s.classList.remove("flash");
}
async function dramatic(){
 $("title").classList.add("glow");
 for(let n=3;n>=1;n--){
  $("countdown").textContent=n;$("countdown").style.display="block";
  beep(220+n*80,.09,"square",.045);await wait(210);
 }
 $("countdown").style.display="none";
 $("title").classList.remove("glow");
}
async function spin(isRush=false){
 if(busy)return;
 if(!isRush&&balls<1){$("msg").textContent="玉がありません";return}
 busy=true;update();spins++;
 if(!isRush)balls--;
 update();
 audioReady();startBgm();
 $("msg").textContent=isRush?"RUSH高速変動…":"変動中…";

 const win=Math.random()<(isRush?RUSH_RATE:NORMAL_RATE);
 const preHit=win && $("pre").checked && Math.random()<PRE_RATE;
 const hot=win||Math.random()<.10;

 if(preHit){await preAlert();addHistory("先バレ発生！");}
 if(hot){
   $("title").textContent=preHit?"警戒":"兆候";
   $("title").style.color="#ff4557";
   document.querySelectorAll(".reel").forEach(x=>x.classList.add("hot"));
   beep(180,.12,"square",.06);
 }
 await wait(isRush?190:470);

 if(win){
   await dramatic();
   await handDrop();
 }
 const nums=win?[7,7,7]:[1+Math.floor(Math.random()*9),1+Math.floor(Math.random()*9),1+Math.floor(Math.random()*9)];
 for(let i=0;i<3;i++){
   $(["r1","r2","r3"][i]).textContent=nums[i];
   beep(220+i*100,.045,"sine",.025);
   await wait(isRush?85:145);
 }

 if(win){
   $("cutinText").textContent=isRush?"RUSH HIT!":"BONUS";
   $("cutin").style.display="flex";
   $("screen").classList.add("flash");
   beep(720,.10,"square",.06);beep(920,.13,"square",.06);beep(1180,.22,"sine",.06);
   const payout=isRush?120:600;balls+=payout;
   if(isRush){
     rush=Math.min(80,rush+20);streak++;
     addHistory("RUSH当たり +20回 / +"+payout+"玉");
     $("msg").textContent="大当たり！";
   }else{
     mode="rush";rush=80;streak=1;
     addHistory("初当たり → RUSH突入 / +"+payout+"玉");
     $("msg").textContent="RUSH突入！";
   }
   setTimeout(()=>{$("cutin").style.display="none";$("screen").classList.remove("flash")},560);
 }else{
   $("msg").textContent="ハズレ";
   if(isRush){
     rush--; 
     if(rush<=0){
       mode="normal";streak=0;
       addHistory("RUSH終了");
       $("msg").textContent="RUSH終了";
     }
   }
 }

 $("title").textContent="GHOUL";$("title").style.color="";
 document.querySelectorAll(".reel").forEach(x=>x.classList.remove("hot"));
 lamps(false);busy=false;update();

 if(auto){
   setTimeout(()=>{
     if(mode==="rush")spin(true);else spin(false);
   },mode==="rush"?170:600);
 }
}
$("spin").addEventListener("click",()=>{audioReady();spin(false)});
$("rushBtn").addEventListener("click",()=>{audioReady();spin(true)});
$("auto").addEventListener("click",()=>{audioReady();auto=!auto;update();if(auto&&!busy)mode==="rush"?spin(true):spin(false)});
$("reset").addEventListener("click",()=>{
 stopBgm();balls=250;spins=0;mode="normal";rush=0;auto=false;streak=0;
 $("history").textContent="まだありません";$("msg").textContent="STARTで変動";
 $("title").textContent="GHOUL";$("title").style.color="";
 $("cutin").style.display="none";$("preAlert").style.display="none";$("dropbar").style.display="none";$("dropText").style.display="none";
 update();
});
$("bgm").addEventListener("change",()=>{$("bgm").checked?startBgm():stopBgm()});
document.addEventListener("touchstart",()=>{audioReady();if($("bgm").checked)startBgm()},{once:true});
update();
})();
</script>
</body>
</html>
